name: Beastbound Independent Actual Terrestrial Arrival
on:
  pull_request:
    paths:
      - '.github/workflows/living-terrestrial-positive-arrival.yml'
      - 'rules/independent-sapient-terrestrial-journey.js'
      - 'rules/independent-sapient-terrestrial-return-preflight.js'
      - 'rules/independent-sapient-terrestrial-visitor-proposal.js'
      - 'world/emergent-people.js'
      - 'world/sapient-beast-persons.js'
      - 'rules/independent-sapient-terrestrial-proposal.js'
      - 'tests/living-npc-sapient-bilateral-proposal-discussion.test.js'
      - 'tests/living-npc-sapient-positive-continuity-assessment.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-real-arrival:
    name: Original source-funded first legs and freely chosen visitor next-leg checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search 96 independent source-resolved worlds for first arrivals and separately accepted next legs
        env:
          BEASTBOUND_SAPIENT_SAMPLE_WORLD_COUNT: '96'
        run: node tests/living-npc-sapient-positive-continuity-assessment.test.js
