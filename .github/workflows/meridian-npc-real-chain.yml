name: Beastbound Meridian Real-Chain Verification
# Exact source-born long-run evidence, NOT a draft-PR regression penalty.
# A push to this workflow file starts one focused proof; later edits to
# unrelated files do not keep replaying this expensive simulation.
on:
  push:
    branches:
      - feat/reuse-existing-full-meridian-ladder-for-all-actors-20261120
    paths:
      - .github/workflows/meridian-npc-real-chain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meridian-real-first-gate:
    name: Authentic NPC Foundation to Gate 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine source-born NPC through all 108 source-earned Gates
        env:
          BEASTBOUND_MERIDIAN_GATE_TARGET: '108'
          BEASTBOUND_MERIDIAN_MAX_ADDITIONAL_DAYS: '18000'
        run: node tests/meridian-npc-actual-unbroken-source-progression.test.js
