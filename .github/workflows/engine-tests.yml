name: Beastbound Engine Tests
# Draft PRs: fast edit-time checks, no repeated world-long full regressions.
# Ready-for-review and explicit workflow_dispatch: COMPLETE regression for
# the exact head, all *.test.js exactly once, required final 'test' gate.
# GitHub itself prohibits merging a draft PR.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
concurrency:
  group: beastbound-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  edit-smoke:
    name: edit-smoke
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast source-parity, original Meridian and changed-file checks
        run: node scripts/run-regression-smoke.js

  regression-batch:
    name: Regression batch ${{ matrix.batch }}
    # Full regression remains mandatory BEFORE merge, not after every
    # in-progress draft commit. Once ready, every new head reruns all tests.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run runtime-balanced FULL regression without duplicates
        run: node scripts/run-regression-batches.js --shards=6 --shard=${{ matrix.batch }}

  test:
    name: test
    # Preserve the existing required check. It can only PASS on a
    # ready-for-review PR or an explicit full workflow dispatch, NEVER
    # merely because the rapid draft smoke passed.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) }}
    needs: [edit-smoke, regression-batch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject incomplete, failed or cancelled full regression
        shell: bash
        run: |
          if [[ "${{ needs.regression-batch.result }}" != "success" ]]; then
            echo "::error::Required full regression did not pass on this exact head."
            exit 1
          fi
          if [[ "${{ needs.edit-smoke.result }}" != "success" && "${{ needs.edit-smoke.result }}" != "skipped" ]]; then
            echo "::error::Fast source-backed checks failed."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete unique test inventory and core source coverage
        # Every test already ran in exactly one shard; do NOT run it again.
        run: node scripts/run-regression-batches.js --shards=6 --validate
