name: Beastbound Engine Tests
# Three independent deterministic batches cover ALL discovered test files
# exactly once, with a final cross-system gate. Unlike the older static
# inventory, new tests are automatically included; skipped/failed batches
# fail the unchanged required 'test' job. No push-trigger duplicate.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: beastbound-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression-batch:
    name: Regression batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete assigned regression batch
        shell: bash
        run: node scripts/run-regression-batches.js --shards=3 --shard=${{ matrix.batch }}

  # Preserve the preexisting required GitHub check name 'test'. We use
  # always() so a failed/cancelled matrix batch makes this check FAIL rather
  # than silently treating a skipped final gate as approval.
  test:
    name: test
    if: ${{ always() }}
    needs: [regression-batch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject incomplete, failed or cancelled regression batches
        shell: bash
        run: |
          if [[ "${{ needs.regression-batch.result }}" != "success" ]]; then
            echo "::error::Not all source-grounded regression batches passed; merge blocked."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify automatic full inventory coverage and no duplicate tests
        shell: bash
        run: node scripts/run-regression-batches.js --shards=3 --validate
      - name: Final integration gate — living organisation and independent world
        shell: bash
        run: |
          node tests/group-purpose-sustained-independent-departure.test.js
          node tests/group-purpose-independent-member-responses.test.js
          node tests/group-member-persistent-dissent-agency.test.js
          node tests/group-original-coordinator-setback-reconsideration.test.js
          node tests/original-diplomatic-courier-public-provenance.test.js
          node tests/diplomacy-genuine-bilateral-exploratory-contact.test.js
          node tests/source-parity.test.js
          node tests/source-coverage.test.js
