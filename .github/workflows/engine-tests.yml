name: Beastbound Engine Tests
# Private-repository minute budget: one complete runner, only for PRs or
# explicit manual runs. Never duplicate a merge with a push-triggered suite.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: beastbound-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Keep the existing required check name 'test', but charge just one
  # runner's runtime instead of four separately rounded runners plus gate.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run entire regression inventory; stop on first failure
        shell: bash
        run: |
          tests=(
            tests/living-career-peer-guidance.test.js
          tests/living-work-independent-offers.test.js
          tests/living-career-attestations.test.js
          tests/living-career-authored-duties.test.js
